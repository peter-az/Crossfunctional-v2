<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@page{size:420mm 297mm;margin:10mm 10mm 12mm}
:root{--ink:#1B2A2E;--muted:#5D6D70;--line:#C9D4D2;--lane-a:#EAF0EF;--lane-b:#F7F9F9;--head:#DCE6E4;--accent:#0E6B63;--amber:#8F5B0E;--amber-bg:#FBEFD9;--risk:#A93F2B;--risk-bg:#F8E3DD;--zero:#E3E9E8}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:"DejaVu Sans",sans-serif;color:var(--ink);font-size:11px;line-height:1.5;background:#fff}
.page{break-after:page;display:flex;flex-direction:column;gap:8px}
.page:last-child{break-after:auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:6px}
.ph h1{font-size:17px;margin:0}
.ph .sub{font-size:13px;color:var(--accent);font-weight:700}
.ph .meta{font-size:10px;color:var(--muted);text-align:left}
.ver{background:var(--ink);color:#fff;padding:1px 8px;border-radius:3px;font-weight:700}
.kpis{display:flex;gap:18px;font-size:11px;color:var(--muted);flex-wrap:wrap;align-items:center}
.kpis b{color:var(--ink);font-size:13px}
.kpis .s b{color:var(--accent)}
.legend{display:flex;gap:14px;font-size:10px;color:var(--muted);align-items:center;flex-wrap:wrap}
.board{position:relative;display:grid;row-gap:26px;padding-bottom:14px;border:1px solid var(--line);background:var(--lane-b)}
.lanebg{grid-row:1 / -1;border-inline-start:1px solid var(--line)}
.lanebg.alt{background:var(--lane-a)}
.lanehead{grid-row:1;background:var(--head);border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:6px;font-weight:700;font-size:10.5px;text-align:center;display:flex;align-items:center;justify-content:center;min-height:44px}
.cell{z-index:2;padding-inline:6px;align-self:start;display:flex;justify-content:center}
.step{width:100%;background:#fff;border:1px solid #9FB0AE;border-radius:5px;padding:5px 7px;display:flex;flex-direction:column;gap:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.num{font-weight:700;font-size:10px;background:var(--ink);color:#fff;min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;padding-inline:4px}
.t{font-weight:700;font-size:10.5px;line-height:1.4}
.foot{display:flex;justify-content:space-between;gap:4px;font-size:9.5px;color:var(--muted)}
.dur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sla{font-size:9.5px;font-weight:700;border-radius:3px;padding:0 6px;white-space:nowrap}
.sla.def{background:var(--accent);color:#fff}
.sla.zero{background:var(--zero);color:var(--muted)}
.sla.na{background:var(--amber-bg);color:var(--amber);border:1px dashed var(--amber)}
.flag{color:var(--risk);font-weight:700;white-space:nowrap}
.flag i,i.fl{width:12px;height:12px;border-radius:50%;background:var(--risk);color:#fff;font-style:normal;font-size:9px;display:inline-grid;place-items:center}
.hand{font-size:9.5px;border:1px dashed var(--muted);color:var(--muted);background:#fff;border-radius:10px;padding:0 8px;margin-top:8px;white-space:nowrap}
.cont{font-size:9.5px;color:var(--accent);font-weight:700;border:1px solid var(--accent);border-radius:10px;padding:0 8px;background:#fff;white-space:nowrap}
svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.seq{stroke:#4a5a5d;stroke-width:1.3;fill:none}
.par{stroke:var(--muted);stroke-width:1.1;stroke-dasharray:4 3;fill:none}
table{width:100%;border-collapse:collapse;font-size:9.5px}
thead{display:table-header-group}
th{background:var(--head);text-align:start;padding:5px;border:1px solid var(--line);font-size:10px}
td{border:1px solid var(--line);padding:5px;vertical-align:top;white-space:pre-line}
tr{break-inside:avoid}
td.c{text-align:center;white-space:nowrap}
td.ch{background:var(--risk-bg)}
.note{background:var(--amber-bg);padding:5px 10px;border-radius:4px;font-size:10px}
</style></head><body><div id="root"></div>
<script>
const DATA=__DATA__;
const LANE_ORDER=["شركاء الاعمال واستقطاب الكفاءات","شركاء الاعمال","استقطاب الكفاءات","المسئول الأول بالمجموعة","المسئول الأول بالمجموعات","الإدارة العليا","الكفاءة المؤسسية","عمليات الموارد البشرية","الالتزام المصرفي","الخدمات الطبية","الامن","هيئة الرقابة الإدارية","الأجور والمزايا","إدارة دمج ومتابعة الموظفين"];
const TAB={plan:"أولاً: تخطيط العمالة",ext:"ثانياً (أ): التعيين الخارجي",exp:"ثانياً (ب): ذوو الخبرات"};
const CHUNK=__CHUNK__;
const days=n=>n===1?"يوم":n===2?"يومان":(n>=3&&n<=10)?"أيام":"يوم";
const fd=n=>`${n} ${days(n)}`;
const slaHTML=s=>s===null||s===undefined?'<span class="sla na"><bdi>SLA</bdi> · غير محدد</span>':s===0?'<span class="sla zero"><bdi>SLA</bdi> · 0</span>':`<span class="sla def"><bdi>SLA</bdi> · ${fd(s)}</span>`;
const durText=t=>t==null?"—":typeof t==="number"?fd(t):t.replace(/\s+/g," ").trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const legend=`<div class="legend"><span>${slaHTML(3)} SLA محدد</span><span>${slaHTML(0)} SLA = صفر في الملف</span><span>${slaHTML(null)} لا توجد قيمة SLA</span><span><span class="hand" style="margin:0">مشارك · 8</span> جهة مشاركة</span><span><i class="fl">!</i> توجد تحديات (انظر جدول التفاصيل)</span></div>`;
let html='', boards=[];
DATA.forEach(s=>{
  const st=s.steps, slaSum=st.reduce((a,x)=>a+(x.sla||0),0);
  const present=new Set(st.flatMap(x=>[x.owner,x.part]));
  const lanes=LANE_ORDER.filter(l=>present.has(l)).concat([...present].filter(l=>!LANE_ORDER.includes(l)));
  const col=l=>lanes.indexOf(l)+1;
  const kp=`<div class="kpis"><span>عدد الخطوات <b>${st.length}</b></span><span class="s">إجمالي SLA <b>${slaSum?fd(slaSum):'غير محدد'}</b></span><span>إجمالي المدة (حسب الملف) <b>${s.sheetTotal?s.sheetTotal.time+' يوم':'موسمي'}</b></span><span>خطوات بدون SLA <b>${st.filter(x=>x.sla===null).length}</b></span><span>خطوات بها تحديات <b>${st.filter(x=>x.chal).length}</b></span></div>`;
  const pages=Math.ceil(st.length/CHUNK);
  for(let p=0;p<pages;p++){
    const sl=st.slice(p*CHUNK,(p+1)*CHUNK), off=p*CHUNK, bid=`b-${s.key}-${p}`;
    let h=`<section class="page"><div class="ph"><div><h1>إجراءات إدارة التعيينات — مخطط وظيفي متقاطع</h1><div class="sub">${TAB[s.key]}${pages>1?` · الخطوات ${sl[0].n}–${sl[sl.length-1].n}`:''}</div></div><div class="meta"><span class="ver">V1.0</span> مسودة للمراجعة · سبتمبر 2026</div></div>${kp}${p===0&&s.note?`<div class="note">${esc(s.note)}</div>`:''}${legend}
    <div class="board" id="${bid}" style="grid-template-columns:repeat(${lanes.length},minmax(0,1fr));grid-template-rows:auto repeat(${sl.length+(p<pages-1?1:0)+(p>0?1:0)},auto)">`;
    h+=lanes.map((l,i)=>`<div class="lanebg ${i%2?'alt':''}" style="grid-column:${i+1}"></div><div class="lanehead" style="grid-column:${i+1}">${esc(l)}</div>`).join('');
    let r=2;
    if(p>0){h+=`<div class="cell" style="grid-row:${r};grid-column:${col(st[off-1].owner)}"><span class="cont" id="${bid}-in">تابع من الخطوة ${st[off-1].n}</span></div>`;r++;}
    sl.forEach((x,j)=>{
      h+=`<div class="cell" style="grid-row:${r};grid-column:${col(x.owner)}"><div class="step" id="${bid}-s${j}"><span class="top"><span class="num">${x.n}</span>${slaHTML(x.sla)}</span><span class="t">${esc(x.title)}</span><span class="foot"><span class="dur">المدة: ${esc(durText(x.time))}</span>${x.chal?'<span class="flag"><i>!</i> تحدٍّ</span>':''}</span></div></div>`;
      if(x.part&&x.part!==x.owner) h+=`<div class="cell" style="grid-row:${r};grid-column:${col(x.part)}"><span class="hand" id="${bid}-h${j}">مشارك · ${x.n}</span></div>`;
      r++;
    });
    if(p<pages-1){h+=`<div class="cell" style="grid-row:${r};grid-column:${col(st[off+CHUNK].owner)}"><span class="cont" id="${bid}-out">يتبع في الصفحة التالية ← الخطوة ${st[off+CHUNK].n}</span></div>`;}
    h+=`<svg class="links"><defs><marker id="ah-${bid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5a5d"/></marker></defs><g></g></svg></div></section>`;
    html+=h; boards.push({bid,n:sl.length,hasIn:p>0,hasOut:p<pages-1});
  }
  // detail table
  html+=`<section class="page"><div class="ph"><div><h1>جدول تفاصيل الإجراءات</h1><div class="sub">${TAB[s.key]}</div></div><div class="meta"><span class="ver">V1.0</span> النص الكامل كما ورد في الملف</div></div>
  <table><thead><tr><th style="width:3%">#</th><th style="width:14%">القطاع المسئول</th><th style="width:12%">المشارك</th><th>الإجراء</th><th style="width:7%">SLA</th><th style="width:10%">المدة المستغرقة</th><th style="width:18%">التحديات</th></tr></thead><tbody>`+
  st.map(x=>`<tr><td class="c">${x.n}</td><td>${esc(x.owner)}</td><td>${esc(x.part||'—')}</td><td>${esc(x.action)}</td><td class="c">${x.sla===null?'غير محدد':fd(x.sla)}</td><td>${esc(typeof x.time==='number'?fd(x.time):(x.time||'—'))}</td><td class="${x.chal?'ch':''}">${esc(x.chal||'—')}</td></tr>`).join('')+
  `<tr><td></td><td colspan="3"><b>الإجمالي</b></td><td class="c"><b>${slaSum?fd(slaSum):'غير محدد'}</b></td><td><b>${s.sheetTotal?s.sheetTotal.time+' يوم (حسب الملف)':'—'}</b></td><td></td></tr></tbody></table></section>`;
});
document.getElementById('root').innerHTML=html;
function draw(){
  boards.forEach(({bid,n,hasIn,hasOut})=>{
    const bd=document.getElementById(bid), B=bd.getBoundingClientRect();
    const k=B.width/bd.offsetWidth||1;const R=el=>{const r=el.getBoundingClientRect();return{l:(r.left-B.left)/k,r:(r.right-B.left)/k,t:(r.top-B.top)/k,b:(r.bottom-B.top)/k,cx:((r.left+r.right)/2-B.left)/k,cy:((r.top+r.bottom)/2-B.top)/k}};
    const seq=[]; if(hasIn) seq.push(document.getElementById(bid+'-in'));
    for(let j=0;j<n;j++) seq.push(document.getElementById(bid+'-s'+j));
    if(hasOut) seq.push(document.getElementById(bid+'-out'));
    let p='';
    for(let j=0;j<n;j++){const hd=document.getElementById(bid+'-h'+j); if(hd){const a=R(document.getElementById(bid+'-s'+j)),c=R(hd);const x1=c.cx<a.cx?a.l:a.r,x2=c.cx<a.cx?c.r:c.l;p+=`<path class="par" d="M${x1} ${c.cy} H${x2}"/>`;}}
    for(let q=0;q<seq.length-1;q++){const a=R(seq[q]),b=R(seq[q+1]);
      const d=Math.abs(a.cx-b.cx)<2?`M${a.cx} ${a.b} V${b.t-2}`:`M${a.cx} ${a.b} V${b.t-12} H${b.cx} V${b.t-2}`;
      p+=`<path class="seq" d="${d}" marker-end="url(#ah-${bid})"/>`;}
    bd.querySelector('svg g').innerHTML=p;
  });
}
function fit(){const AV=1030;document.querySelectorAll('.page').forEach(pg=>{if(!pg.querySelector('.board'))return;const h=pg.getBoundingClientRect().height;if(h>AV){pg.style.zoom=(AV/h).toFixed(4);}});}
window.__draw=()=>{fit();draw();};
</script></body></html>
